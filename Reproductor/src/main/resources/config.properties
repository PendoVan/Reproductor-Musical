
# ===================================
# Configuración del Reproductor Musical
# ===================================

# API de descarga de música
api.base.url=http://localhost:8000
api.timeout=30

# Calidad de audio (kbps)
audio.quality=192

# Directorio de descargas
# Por defecto: ${user.home}/Music/Reproductor
# downloads.directory=/ruta/personalizada

# Configuración de búsqueda
search.max.results=50
search.timeout=60

# Logs
logging.enabled=true
logging.level=INFO